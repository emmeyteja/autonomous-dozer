[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-dozer"
version = "0.1.0"
description = "Simulation-first sand-pile leveling research baseline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
dev = ["pytest>=7,<9"]
plots = ["matplotlib>=3.6,<4"]

[project.scripts]
dozer-demo = "autonomous_dozer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
